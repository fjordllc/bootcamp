name: Codex follow up AI PR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: codex-follow-up
  cancel-in-progress: false

env:
  RUBY_VERSION: 3.4.3
  NODE_VERSION: 22.19.0
  MAX_FIX_ATTEMPTS: "3"

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - name: Find managed PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label Codex \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("ai/issue-")) | .number]')"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  inspect:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ matrix.pr }}
    steps:
      - name: Read PR state
        id: state
        run: |
          mkdir -p tmp
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,url,headRefName,headRefOid,body \
            > tmp/pr.json
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,state,bucket,link,workflow \
            > tmp/checks.json || true
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --slurp \
            > tmp/comments.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            --slurp \
            > tmp/pull-reviews.json
          gh api graphql \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" \
            -f query='
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100) {
                      nodes {
                        id
                        isResolved
                        comments(first:50) {
                          nodes { author { login } body path line url }
                        }
                      }
                    }
                  }
                }
              }' > tmp/reviews.json

          ruby <<'RUBY'
          require "json"
          checks = JSON.parse(File.read("tmp/checks.json"))
          comments = JSON.parse(File.read("tmp/comments.json")).flatten
          pull_reviews = JSON.parse(File.read("tmp/pull-reviews.json")).flatten
          claude_reviewed =
            checks.any? { |check| check["workflow"] == "Claude review Codex PR" && check["bucket"] == "pass" } ||
            comments.any? { |comment| comment["body"].to_s.include?("<!-- claude-ai-review -->") }
          coderabbit_reviewed =
            checks.any? { |check| check["name"].to_s.match?(/CodeRabbit/i) && check["bucket"] == "pass" } ||
            pull_reviews.any? { |review| review.dig("user", "login").to_s.match?(/\Acoderabbitai(?:\[bot\])?\z/i) }
          pending =
            checks.empty? ||
            checks.any? { |check| check["bucket"] == "pending" } ||
            !claude_reviewed ||
            !coderabbit_reviewed
          failed = checks.select { |check| %w[fail cancel].include?(check["bucket"]) }
          threads = JSON.parse(File.read("tmp/reviews.json"))
            .dig("data", "repository", "pullRequest", "reviewThreads", "nodes")
            .reject { |thread| thread["isResolved"] }
            .select do |thread|
              thread.dig("comments", "nodes").any? do |comment|
                comment.dig("author", "login").to_s.match?(/\A(?:coderabbitai|claude)(?:\[bot\])?\z/i)
              end
            end
          File.write("tmp/actionable-threads.json", JSON.pretty_generate(threads))
          File.write("tmp/thread-ids.txt", threads.map { |thread| thread["id"] }.join("\n"))
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "pending=#{pending}"
            output.puts "failed=#{failed.any?}"
            output.puts "threads=#{threads.any?}"
            output.puts "head_sha=#{JSON.parse(File.read("tmp/pr.json")).fetch("headRefOid")}"
          end
          RUBY

      - name: Count previous attempts
        id: attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --slurp \
            --jq '[flatten[] | select(.body | contains("<!-- codex-auto-fix-attempt -->"))] | length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Mark completed
        if: steps.state.outputs.pending == 'false' && steps.state.outputs.failed == 'false' && steps.state.outputs.threads == 'false'
        env:
          GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label Codex
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body $'CIとClaude・CodeRabbitレビューの確認が完了しました。\n\n<!-- codex-ai-completed -->'

      - name: Stop after maximum attempts
        if: |
          steps.state.outputs.pending == 'false' &&
          (steps.state.outputs.failed == 'true' || steps.state.outputs.threads == 'true') &&
          fromJSON(steps.attempts.outputs.count) >= fromJSON(env.MAX_FIX_ATTEMPTS)
        env:
          GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label Codex
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body $'Codexによる自動修正が上限（3回）に達しました。人による確認が必要です。\n\n<!-- codex-ai-stopped -->'

      - name: Checkout PR
        if: |
          steps.state.outputs.pending == 'false' &&
          (steps.state.outputs.failed == 'true' || steps.state.outputs.threads == 'true') &&
          fromJSON(steps.attempts.outputs.count) < fromJSON(env.MAX_FIX_ATTEMPTS)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.state.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Prepare correction context
        if: |
          steps.state.outputs.pending == 'false' &&
          (steps.state.outputs.failed == 'true' || steps.state.outputs.threads == 'true') &&
          fromJSON(steps.attempts.outputs.count) < fromJSON(env.MAX_FIX_ATTEMPTS)
        run: |
          {
            echo "# Pull Request"
            jq . tmp/pr.json
            echo
            echo "# Checks"
            cat tmp/checks.json
            echo
            echo "# Unresolved Claude / CodeRabbit review threads"
            cat tmp/actionable-threads.json
            echo
            echo "# Failed GitHub Actions logs"
          } > tmp/codex-pr-context.md

          jq -r '.[] | select(.bucket == "fail") | .link' tmp/checks.json |
            sed -n 's#.*actions/runs/\\([0-9]*\\).*#\\1#p' |
            sort -u |
            while read -r run_id; do
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed \
                >> tmp/codex-pr-context.md 2>&1 || true
            done

      - name: Fix with Codex
        if: |
          steps.state.outputs.pending == 'false' &&
          (steps.state.outputs.failed == 'true' || steps.state.outputs.threads == 'true') &&
          fromJSON(steps.attempts.outputs.count) < fromJSON(env.MAX_FIX_ATTEMPTS)
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-sol
          effort: high
          prompt-file: .github/codex/follow-up-pr.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: tmp/codex-result.md

      - name: Build correction artifact
        if: |
          steps.state.outputs.pending == 'false' &&
          (steps.state.outputs.failed == 'true' || steps.state.outputs.threads == 'true') &&
          fromJSON(steps.attempts.outputs.count) < fromJSON(env.MAX_FIX_ATTEMPTS)
        run: |
          git add --intent-to-add --all
          git diff --binary HEAD -- . ':(exclude)tmp/**' > codex.patch
          jq -r .headRefName tmp/pr.json > tmp/head-ref.txt
          jq -r .headRefOid tmp/pr.json > tmp/head-sha.txt

      - name: Upload correction
        if: |
          steps.state.outputs.pending == 'false' &&
          (steps.state.outputs.failed == 'true' || steps.state.outputs.threads == 'true') &&
          fromJSON(steps.attempts.outputs.count) < fromJSON(env.MAX_FIX_ATTEMPTS)
        uses: actions/upload-artifact@v4
        with:
          name: codex-follow-up-${{ matrix.pr }}
          path: |
            codex.patch
            tmp/codex-result.md
            tmp/head-ref.txt
            tmp/head-sha.txt
            tmp/thread-ids.txt
          if-no-files-found: error

  validate:
    needs: [discover, inspect]
    if: always() && needs.inspect.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download correction if present
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codex-follow-up-${{ matrix.pr }}

      - name: Checkout correction base
        if: steps.download.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: false

      - name: Validate correction
        if: steps.download.outcome == 'success'
        run: |
          head_sha="$(cat tmp/head-sha.txt)"
          git fetch origin "$head_sha"
          git checkout --detach "$head_sha"
          if test -s codex.patch; then
            git apply --check codex.patch
            git apply --index codex.patch
            git diff --cached --check
          fi
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |file| YAML.parse_file(file) }'

      - name: Upload validated correction
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codex-follow-up-validated-${{ matrix.pr }}
          path: |
            codex.patch
            tmp/codex-result.md
            tmp/head-ref.txt
            tmp/head-sha.txt
            tmp/thread-ids.txt
          if-no-files-found: error

  publish:
    needs: [discover, inspect, validate]
    if: always() && needs.validate.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download validated correction if present
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codex-follow-up-validated-${{ matrix.pr }}

      - name: Publish correction
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          branch="$(cat tmp/head-ref.txt)"
          head_sha="$(cat tmp/head-sha.txt)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$branch"
          test "$(git rev-parse HEAD)" = "$head_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if test -s ../codex.patch; then
            git apply --index ../codex.patch
            git commit -m "CI・AIレビューの指摘に対応"
            git push origin "$branch"
          fi

          {
            echo "CodexがCI・AIレビューを確認し、自動修正を実行しました。"
            echo
            cat ../tmp/codex-result.md
            echo
            echo "<!-- codex-auto-fix-attempt -->"
          } > ../comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file ../comment.md

          while read -r thread_id; do
            test -n "$thread_id" || continue
            gh api graphql \
              -f threadId="$thread_id" \
              -f query='mutation($threadId:ID!) { resolveReviewThread(input:{threadId:$threadId}) { thread { isResolved } } }'
          done < ../tmp/thread-ids.txt
