name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUBY_VERSION: 4.0.10
  NODE_VERSION: 22.23.4
  BUNDLE_JOBS: "3"
  BUNDLE_RETRY: "3"
  TZ: Asia/Tokyo
  TEST_SHARDS: 8

jobs:
  build:
    # node_modulesのキャッシュをtestジョブと共有するため、同じイメージで動かす。
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      # node_modulesはキャッシュがないときだけここで作る。testジョブは復元するだけで済む。
      - name: Look up node_modules cache
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-24.04-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          lookup-only: true

      - name: Set up Node
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm packages
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules cache
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-24.04-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      # mainで記録した所要時間を使い、各シャードの合計時間が揃うようにテストを振り分ける。
      # シャードごとに振り分けると、参照する記録が食い違ったときにテストが漏れるため、ここで一度だけ決める。
      - name: Restore test timings
        uses: actions/cache/restore@v4
        with:
          path: tmp/test_timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: |
            test-timings-

      - name: Split test files into shards
        run: ruby bin/ci-test-timings split --shards "$TEST_SHARDS" --timings tmp/test_timings.json --output tmp/test_shards

      - name: Upload test shards
        uses: actions/upload-artifact@v4
        with:
          name: test-shards
          path: tmp/test_shards
          if-no-files-found: error
          overwrite: true

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Install system packages
        run: |
          apt_get() {
            sudo timeout "$1" apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "${@:2}"
          }

          install_packages() {
            apt_get 300 update || return 1
            apt_get 900 install -y libvips libheif-dev || return 1
          }

          for attempt in 1 2 3; do
            if install_packages; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi

            sudo timeout 120 dpkg --configure -a || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep "$((attempt * 10))"
          done

      - name: RuboCop
        run: bundle exec rubocop --format progress

      - name: Slim Lint
        run: bundle exec slim-lint app/views -c config/slim_lint.yml

      - name: Traceroute
        run: FAIL_ON_ERROR=1 bundle exec rake traceroute

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Test JavaScript
        run: node --test test/javascript/*.mjs

  test:
    # The pinned Playwright version does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/ci_test
      TEST_SHARD: ${{ matrix.shard }}

    steps:
      # servicesで起動するとイメージの取得が終わるまで他の準備を始められないため、裏で起動して準備と並行させる。
      # 起動の完了は「Enable pgvector extension」で待つ。
      - name: Start PostgreSQL in the background
        run: |
          nohup docker run --detach --name postgres \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=ci_test \
            --publish 5432:5432 pgvector/pgvector:pg14 > "$RUNNER_TEMP/postgres-start.log" 2>&1 &

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-24.04-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm packages
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get week for apt package cache
        id: apt-cache-week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-archives-test-${{ hashFiles('.github/workflows/ci.yml') }}-${{ steps.apt-cache-week.outputs.week }}
          restore-keys: |
            apt-archives-test-${{ hashFiles('.github/workflows/ci.yml') }}-

      - name: Install system packages
        run: |
          # 使い捨ての環境なので、dpkgのfsyncとman-dbの更新を省く。
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/force-unsafe-io > /dev/null
          sudo rm -f /var/lib/man-db/auto-update

          archives="$HOME/apt-archives"
          mkdir -p "$archives/partial"
          echo "Cached apt packages: $(find "$archives" -name '*.deb' | wc -l)"

          apt_get() {
            sudo timeout "$1" apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives="$archives" "${@:2}"
          }

          install_packages() {
            apt_get 300 update || return 1
            apt_get 900 install -y fonts-noto-cjk ffmpeg imagemagick libvips libheif-dev libuv1-dev postgresql-client || return 1
            for package in libheif-plugin-aomdec libheif-plugin-libde265; do
              if apt-cache show "$package" >/dev/null 2>&1; then
                apt_get 900 install -y "$package" || return 1
              fi
            done
          }

          save_archives() {
            sudo chown -R "$(id -u):$(id -g)" "$archives"
            rm -rf "$archives/partial" "$archives/lock"
            echo "Apt packages to cache: $(find "$archives" -name '*.deb' | wc -l) ($(du -sh "$archives" | cut -f1))"
          }

          for attempt in 1 2 3; do
            if install_packages; then
              save_archives
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi

            sudo timeout 120 dpkg --configure -a || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep "$((attempt * 10))"
          done

      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi

            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get clean
            sleep "$((attempt * 10))"
          done

          npx playwright install --with-deps chromium

      - name: Enable pgvector extension
        run: |
          # 接続したまま応答が返らない場合にも期限で打ち切れるよう、psql自体も残り時間で止める。
          deadline=$((SECONDS + 120))
          while true; do
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo "PostgreSQL did not become ready in time"
              cat "$RUNNER_TEMP/postgres-start.log" || true
              docker logs postgres || true
              exit 1
            fi
            if timeout "$remaining" psql -h localhost -U postgres -d ci_test -c "CREATE EXTENSION IF NOT EXISTS vector;" 2> /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: Precompile assets
        run: bundle exec rails assets:clean assets:precompile

      - name: Download test shards
        uses: actions/download-artifact@v4
        with:
          name: test-shards
          path: tmp/test_shards

      - name: Select test files
        run: |
          cp "tmp/test_shards/shard-${TEST_SHARD}.txt" tmp/test_files.txt
          wc -l tmp/test_files.txt

      - name: Run Rails tests
        env:
          TEST_TIMINGS_PATH: tmp/test_timings/shard-${{ matrix.shard }}.json
        run: xargs bundle exec rails test < tmp/test_files.txt

      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: tmp/test_timings
          if-no-files-found: ignore
          overwrite: true

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: |
            tmp/screenshots
            tmp/capybara
          if-no-files-found: ignore

  test-timings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Download test timings
        uses: actions/download-artifact@v4
        with:
          pattern: test-timings-*
          path: tmp/test_timings
          merge-multiple: true

      - name: Merge test timings
        run: ruby bin/ci-test-timings merge --input tmp/test_timings --output tmp/test_timings.json --summary "$GITHUB_STEP_SUMMARY" > /dev/null

      - name: Upload merged test timings
        uses: actions/upload-artifact@v4
        with:
          name: test-timings
          path: tmp/test_timings.json
          if-no-files-found: ignore
          overwrite: true

      # 全シャードが成功したmainの記録だけを、次回以降の振り分けに使う。
      - name: Save test timings
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: tmp/test_timings.json
          key: test-timings-${{ github.run_id }}
