          $ref: '#/components/responses/JsonObject'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: _bootcamp_session
      description: 既存のUI/API呼び出しで使用するブラウザーセッション、またはJWTに基づくAPIセッション。
    oauth2:
      type: oauth2
      description: DoorkeeperのOAuth2 Bearerトークン。一部の書き込み用エンドポイントでは `write` スコープが必要。
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            read: APIリソースを読み取る。
            write: APIリソースを作成、更新、削除する。
  parameters:
    ListingPage:
      name: page
      in: query
      description: 正の10進整数のみ。配列・オブジェクト・空文字は400。範囲外ページは空の一覧。
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    ListingPerPage:
      name: per_page
      in: query
      description: 正の10進整数のみ。配列・オブジェクト・空文字は400。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdOrShow:
      name: id
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
            enum: [show]
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    CourseId:
      name: course_id
      in: path
      required: true
      schema:
        type: integer
    PracticeId:
      name: practice_id
      in: path
      required: true
      schema:
        type: integer
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: integer
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema:
        type: integer
    CoursesCategoryId:
      name: courses_category_id
      in: path
      required: true
      schema:
        type: integer
    CategoriesPracticeId:
      name: categories_practice_id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
  requestBodies:
    GenericObject:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Position:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              position:
                type: integer
            additionalProperties: true
    Reaction:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              kind:
                type: string
            additionalProperties: true
    Product:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              product:
                type: object
                properties:
                  practice_id:
                    type: integer
                  body:
                    type: string
                  wip:
                    type: boolean
                additionalProperties: true
            additionalProperties: true
    Report:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              report:
                type: object
                properties:
                  title:
                    type: string
                  reported_on:
                    type: string
                    format: date
                  emotion:
                    type: string
                    enum: [sad, neutral, happy, positive]
                  description:
                    type: string
                  wip:
                    type: boolean
                  practice_ids:
                    type: array
                    maxItems: 100
                    items:
                      type: integer
                  learning_times_attributes:
                    type: object
                    additionalProperties: true
                additionalProperties: true
            additionalProperties: true
  responses:
    JsonObject:
      description: JSONレスポンス。対応するjbuilderビューと結合テストをもとにスキーマを拡充する。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiObject'
    Text:
      description: プレーンテキストのレスポンス。
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: 認証が必要、またはBearerトークンが無効。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 認証済みユーザーには、この操作を実行する権限がない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: リソースが見つからない、または認証済みユーザーには非表示になっている。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: リクエストパラメーターが無効。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: バリデーションに失敗した。
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties: true
  schemas:
    PublishedAnnouncement:
      type: object
      required: [id, title, description, published_at, target, url]
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          description: Markdownの原文。
        published_at:
          type: string
          format: date-time
        target:
          type: string
          enum: [all, students, job_seekers]
          description: 通知先の分類。閲覧制限や共有画面への再配布許可ではない。
        url:
          type: string
          description: Bootcamp内の相対パス。
    EventOccurrence:
      type: object
      required: [kind, id, title, url, start_at, end_at, held]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [event, regular_event]
        id:
          type: integer
          description: 元の特別イベントまたは定期イベントのID。
        title:
          type: string
        url:
          type: string
          description: Bootcamp内の相対パス。
        start_at:
          type: string
          format: date-time
          description: 発生回の開始日時。ISO8601、Tokyoの+09:00。
        end_at:
          type: string
          format: date-time
          description: 発生回の終了日時。ISO8601、Tokyoの+09:00。
        held:
          type: boolean
          description: 既存予定モデルでその日に開催するか。falseは祝日または個別休みであり一般的な取消状態ではない。
    ApiObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        error_description:
          type: string
        state:
          type: string
      additionalProperties: true
