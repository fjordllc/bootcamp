openapi: 3.1.0
info:
  title: FJORD BOOT CAMP API
  version: 0.1.0
  summary: Bootcamp APIのアクセス先をまとめた機械可読の一覧。
  description: |
    このファイルは、人やAIエージェント、APIツールが利用可能なアクセス先を
    一か所で把握できるよう、既存の `/api` エンドポイントを記述しています。
    まずはルート単位の網羅と共通のレスポンス形式を扱っています。
    リソースの詳細なスキーマは `app/views/api/**/*.jbuilder` と
    `test/integration/api/**/*_test.rb` をもとに拡充してください。

    Railsは `resource` と `resources` から生成される更新ルートで `PUT` も受け付けます。
    このドキュメントでは、それらの更新エンドポイントを標準の `PATCH` 操作で記述しています。
servers:
  - url: https://bootcamp.fjord.jp
    description: 本番環境
  - url: http://localhost:3000
    description: ローカル開発環境
tags:
  - name: Admin
  - name: Mentor
  - name: Session
  - name: Notifications
  - name: Learning
  - name: Reports
  - name: Products
  - name: Questions
  - name: Users
  - name: Social
  - name: Content
  - name: Search
  - name: Utility
security:
  - sessionCookie: []
  - oauth2: []
paths:
  /api/announcements:
    get:
      tags: [Content]
      summary: 公開済みのお知らせを公開日時・IDの降順で取得する。
      description: |
        .json付きも同じJSONを返す。WIP、公開日時なし、未来の公開日時を除外する。
        targetは通知先の分類であり閲覧制限ではない。足跡は記録しない。
        通常のAPI認証を必要とし、inactive利用者・MCPトークンを拒否する。
      security:
        - sessionCookie: []
        - oauth2: [read]
      parameters:
        - $ref: '#/components/parameters/ListingPage'
        - $ref: '#/components/parameters/ListingPerPage'
      responses:
        '200':
          description: 公開済みのお知らせ。空の一覧のtotal_pagesは0。
          content:
            application/json:
              schema:
                type: object
                required: [announcements, total_pages]
                additionalProperties: false
                properties:
                  announcements:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/PublishedAnnouncement'
                  total_pages:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/events:
    get:
      tags: [Content]
      summary: 特別イベントと定期イベントの発生回を開始日時・種別・元IDの昇順で取得する。
      description: |
        .json付きも同じJSONを返す。日付はAsia/Tokyoで解釈し、from/to両端を含む最大31日。
        特別イベントは期間に重なる未終了のもの（期間前に開始した開催中のものも含む）。
        定期イベントは期間内の予定日を既存の繰り返しルールで展開する。
        WIP、finishedの定期イベント、end_atが現在時刻以前の発生回は除外する。
        祝日・個別休みは削除せずheld=falseとする。kind・id・start_atで発生回を識別する。
        足跡は記録しない。inactive利用者・MCPトークンを拒否する。
      security:
        - sessionCookie: []
        - oauth2: [read]
      parameters:
        - $ref: '#/components/parameters/ListingPage'
        - $ref: '#/components/parameters/ListingPerPage'
        - name: from
          in: query
          description: 厳密なYYYY-MM-DD（0001〜9999年）。省略時はTokyoの今日。
          schema:
            type: string
            format: date
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        - name: to
          in: query
          description: 厳密なYYYY-MM-DD（0001〜9999年）。省略時はfromの6日後。fromより前は不可。
          schema:
            type: string
            format: date
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      responses:
        '200':
          description: 予定一覧。空の一覧のtotal_pagesは0。
          content:
            application/json:
              schema:
                type: object
                required: [events, total_pages]
                additionalProperties: false
                properties:
                  events:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/EventOccurrence'
                  total_pages:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/session:
    post:
      tags: [Session]
      summary: APIセッションを作成する。
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pubsub:
    post:
      tags: [Utility]
      summary: Pub/Subのコールバックを受信する。
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/image:
    post:
      tags: [Utility]
      summary: 画像をアップロードする。
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/count:
    get:
      tags: [Admin]
      summary: 管理者ダッシュボードの各件数を返す。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/inquiries/{id}:
    patch:
      tags: [Admin]
      summary: 管理者APIからお問い合わせを更新する。
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/mentor/practices:
    get:
      tags: [Mentor]
      summary: メンター向けのプラクティス一覧を取得する。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/courses/{course_id}/practices:
    get:
      tags: [Learning]
      summary: コース内のプラクティス一覧を取得する。
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/courses_categories/{courses_category_id}/position:
    patch:
      tags: [Learning]
      summary: コース内のカテゴリーの表示位置を更新する。
      parameters:
        - $ref: '#/components/parameters/CoursesCategoryId'
      requestBody:
        $ref: '#/components/requestBodies/Position'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/categories_practices/{categories_practice_id}/position:
    patch:
      tags: [Learning]
      summary: カテゴリー内のプラクティスの表示位置を更新する。
      parameters:
        - $ref: '#/components/parameters/CategoriesPracticeId'
      requestBody:
        $ref: '#/components/requestBodies/Position'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/notifications:
    get:
      tags: [Notifications]
      summary: 通知一覧を取得する。
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unread]
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notifications/{notification_id}/read_mark:
    patch:
      tags: [Notifications]
      summary: 1件の通知を既読にする。
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/notifications/all_read_mark:
    patch:
      tags: [Notifications]
      summary: すべての通知を既読にする。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/notifications/category_read_mark:
    patch:
      tags: [Notifications]
      summary: カテゴリー内の通知を既読にする。
      parameters:
        - name: target
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/subscriptions:
    get:
      tags: [Users]
      summary: 現在のユーザーの購読一覧を取得する。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/comments:
    get:
      tags: [Social]
      summary: コメント一覧を取得する。
      parameters:
        - name: commentable_type
          in: query
          schema:
            type: string
        - name: commentable_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    post:
      tags: [Social]
      summary: コメントを作成する。
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
  /api/comments/{id}:
    patch:
      tags: [Social]
      summary: コメントを更新する。
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    delete:
      tags: [Social]
      summary: コメントを削除する。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/answers:
    get:
      tags: [Questions]
      summary: 回答一覧を取得する。
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    post:
      tags: [Questions]
      summary: 回答を作成する。
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
  /api/answers/{id}:
    patch:
      tags: [Questions]
      summary: 回答を更新する。
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    delete:
      tags: [Questions]
      summary: 回答を削除する。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/answers/{answer_id}/correct_answer:
    post:
      tags: [Questions]
      summary: 回答をベストアンサーにする。
      parameters:
        - $ref: '#/components/parameters/AnswerId'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    patch:
      tags: [Questions]
      summary: 回答のベストアンサーの指定を更新する。
      parameters:
        - $ref: '#/components/parameters/AnswerId'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/available_emojis:
    get:
      tags: [Social]
      summary: 使用できるリアクション絵文字の一覧を取得する。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/reactions:
    get:
      tags: [Social]
      summary: リアクション一覧を取得する。
      parameters:
        - name: reactionable_gid
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    post:
      tags: [Social]
      summary: リアクションを作成する。
      parameters:
        - name: reactionable_gid
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/reactions/{id}:
    delete:
      tags: [Social]
      summary: リアクションを削除する。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/checks:
    get:
      tags: [Social]
      summary: 確認の一覧を取得する。
      parameters:
        - name: checkable_type
          in: query
          schema:
            type: string
        - name: checkable_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    post:
      tags: [Social]
      summary: 確認を作成する。
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/checks/{id}:
    delete:
      tags: [Social]
      summary: 確認を削除する。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/mention_users:
    get:
      tags: [Users]
      summary: メンションの自動補完候補となるユーザーの一覧を取得する。
      parameters:
        - name: query
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/users:
    get:
      tags: [Users]
      summary: ユーザー一覧を取得する。
      parameters:
        - name: target
          in: query
          schema:
            type: string
        - name: watch
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/users/{id}:
    get:
      tags: [Users]
      summary: ユーザーを取得する。OAuthで認可したユーザー自身を取得する場合は、idに `show` を指定する。
      parameters:
        - $ref: '#/components/parameters/IdOrShow'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: ユーザーを更新する。
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/users/{user_id}/support_context:
    get:
      tags: [Users]
      summary: ユーザーに対するメンター支援用のコンテキストを取得する。
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/tags/{tag}:
    get:
      tags: [Users]
      summary: タグごとのユーザー一覧を取得する。
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/practices:
    get:
      tags: [Learning]
      summary: プラクティス一覧を取得する。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/practices/{id}:
    get:
      tags: [Learning]
      summary: プラクティスを取得する。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    patch:
      tags: [Learning]
      summary: プラクティスを更新する。
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/practices/{practice_id}/learning:
    get:
      tags: [Learning]
      summary: プラクティスの学習状況を取得する。
      parameters:
        - $ref: '#/components/parameters/PracticeId'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    patch:
      tags: [Learning]
      summary: プラクティスの学習状況を更新する。
      parameters:
        - $ref: '#/components/parameters/PracticeId'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/practices/{practice_id}/learning/completion_message:
    patch:
      tags: [Learning]
      summary: プラクティスの学習完了メッセージを更新する。
      parameters:
        - $ref: '#/components/parameters/PracticeId'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/coding_tests/{coding_test_id}/position:
    patch:
      tags: [Learning]
      summary: コーディングテストの表示位置を更新する。
      parameters:
        - name: coding_test_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/Position'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/coding_test_submissions:
    post:
      tags: [Learning]
      summary: コーディングテストの提出を作成する。
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
  /api/reports/unchecked:
    get:
      tags: [Reports]
      summary: 未確認の日報一覧を取得する。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/reports/unchecked/counts:
    get:
      tags: [Reports]
      summary: 未確認の日報の件数をテキストで返す。
      responses:
        '200':
          $ref: '#/components/responses/Text'
  /api/reports/recents:
    get:
      tags: [Reports]
      summary: 最近の日報一覧を取得する。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/reports:
    get:
      tags: [Reports]
      summary: 日報一覧を取得する。
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
        - name: company_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    post:
      tags: [Reports]
      summary: 日報を作成する。
      requestBody:
        $ref: '#/components/requestBodies/Report'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/reports/{id}:
    get:
      tags: [Reports]
      summary: 日報を取得する。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    patch:
      tags: [Reports]
      summary: 日報を更新する。
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/Report'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Reports]
      summary: 日報を削除する。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/reports/{report_id}/comments:
    post:
      tags: [Reports]
      summary: 日報にコメントを作成する。
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        $ref: '#/components/requestBodies/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
  /api/reports/{report_id}/reactions:
    get:
      tags: [Reports]
      summary: 日報のリアクション一覧を取得する。
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    post:
      tags: [Reports]
      summary: 日報にリアクションを作成する。
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        $ref: '#/components/requestBodies/Reaction'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/reports/{report_id}/reactions/{id}:
    delete:
      tags: [Reports]
      summary: 日報のリアクションを削除する。
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/reports/{report_id}/check:
    post:
      tags: [Reports]
      summary: 日報を確認済みにする。
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
    delete:
      tags: [Reports]
      summary: 日報の確認を取り消す。
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/watches:
    get:
      tags: [Social]
      summary: ウォッチ一覧を取得する。
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
  /api/mentor_memos/{id}:
    patch:
      tags: [Mentor]
      summary: メンターメモを更新する。
