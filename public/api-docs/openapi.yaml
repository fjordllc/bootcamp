    get:
      tags: [Content]
      summary: 動画一覧を取得する。
      responses:
        '200':
          $ref: '#/components/responses/JsonObject'
    post:
      tags: [Content]
      summary: アップロードした動画データを使って動画を作成する。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - movie[title]
                - movie[description]
                - movie[movie_data]
              properties:
                movie[title]:
                  type: string
                movie[description]:
                  type: string
                movie[movie_data]:
                  oneOf:
                    - type: string
                      format: binary
                    - type: string
                      description: /api/movies/direct_uploads が返す署名付きblob ID。
                movie[thumbnail]:
                  type: string
                  format: binary
                movie[tag_list]:
                  type: string
                movie[wip]:
                  type: boolean
                movie[practice_ids][]:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
        '403':
          $ref: '#/components/responses/JsonObject'
        '422':
          $ref: '#/components/responses/JsonObject'
  /api/movies/direct_uploads:
    post:
      tags: [Content]
      summary: 動画ファイルのダイレクトアップロード用データを作成する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - blob
              properties:
                blob:
                  type: object
                  required:
                    - filename
                    - byte_size
                    - checksum
                    - content_type
                  properties:
                    filename:
                      type: string
                    byte_size:
                      type: integer
                    checksum:
                      type: string
                      description: Base64でエンコードされたMD5チェックサム。
                    content_type:
                      type: string
                      enum:
                        - video/mp4
                        - video/quicktime
      responses:
        '201':
          $ref: '#/components/responses/JsonObject'
        '400':
          $ref: '#/components/responses/JsonObject'
        '403':
          $ref: '#/components/responses/JsonObject'
